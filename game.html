<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網路安全意識評估</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: "Microsoft JhengHei", "PingFang TC", -apple-system, sans-serif;
  background: #f5f5f0; color: #333;
  min-height: 100vh; overflow-x: hidden;
  transition: background-color 4s ease;
  cursor: default;
}

/* 載入畫面 */
#loading-screen {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #f5f5f0; z-index: 100000;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  transition: background 3s ease;
}
#loading-screen.dark { background: #0a0a0a; }
#loading-screen .load-icon { font-size: 48px; margin-bottom: 20px; transition: all 2s ease; }
#loading-screen .load-text {
  font-size: 14px; color: #888; letter-spacing: 3px;
  transition: color 2s ease;
}
#loading-screen.dark .load-text { color: #444; }
#loading-screen .load-bar {
  width: 260px; height: 2px; background: #e0e0e0;
  margin-top: 20px; border-radius: 1px; overflow: hidden;
}
#loading-screen .load-bar-inner {
  width: 0%; height: 100%; background: #666;
  border-radius: 1px; transition: width 2.5s ease-in-out;
}
#loading-screen.dark .load-bar { background: #1a1a1a; }
#loading-screen.dark .load-bar-inner { background: #ff3333; }

/* 題目間過渡 */
#transition-screen {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #f5f5f0; z-index: 99999;
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  transition: background 2s ease;
}
#transition-screen.dark { background: #0a0a0a; }
#transition-screen .trans-text {
  font-size: 13px; color: #999; letter-spacing: 4px;
  transition: color 2s ease;
}
#transition-screen.dark .trans-text { color: #444; }
#transition-screen .trans-dots {
  margin-top: 16px; font-size: 24px; color: #ccc;
  animation: dotBlink 1.2s infinite;
}
@keyframes dotBlink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* 假死機 */
#bsod-screen {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #0078d7; z-index: 100001;
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  color: #fff; font-family: "Segoe UI", sans-serif;
  padding: 40px;
}
#bsod-screen .bsod-emoji { font-size: 80px; margin-bottom: 20px; }
#bsod-screen .bsod-text { font-size: 24px; margin-bottom: 16px; }
#bsod-screen .bsod-detail { font-size: 14px; color: #aad; max-width: 500px; line-height: 1.8; }

/* 主容器 */
#game-container {
  max-width: 560px; margin: 0 auto;
  padding: 40px 20px; min-height: 100vh;
  display: flex; flex-direction: column;
  justify-content: center; position: relative;
}

/* 卡片 */
.card {
  background: #fff; border-radius: 16px;
  padding: 44px 36px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  transition: all 2s ease;
}
body.dark { background: #0a0a0a; }
body.dark .card {
  background: #111;
  box-shadow: 0 0 50px rgba(255,0,0,0.05);
  border: 1px solid #1a1a1a;
}

.card-title {
  font-size: 20px; font-weight: bold; color: #333;
  margin-bottom: 6px; text-align: center;
  transition: color 2s ease;
}
body.dark .card-title { color: #e8e8e8; }

.card-subtitle {
  font-size: 13px; color: #999;
  text-align: center; margin-bottom: 32px;
  transition: color 2s ease;
}
body.dark .card-subtitle { color: #333; }

.question-text {
  font-size: 17px; color: #333;
  line-height: 1.9; margin-bottom: 28px;
  min-height: 60px; transition: color 2s ease;
}
body.dark .question-text { color: #bbb; }

.option-btn {
  display: block; width: 100%;
  padding: 16px 20px; margin-bottom: 12px;
  border: 1px solid #e8e8e8; border-radius: 12px;
  background: #fafafa; color: #444;
  font-size: 15px; cursor: pointer;
  text-align: left; transition: all 0.4s ease;
  font-family: inherit; position: relative;
}
.option-btn:hover {
  background: #f0f0f0; border-color: #ccc;
  transform: translateX(6px);
}
body.dark .option-btn {
  background: #1a1a1a; border-color: #222; color: #888;
}
body.dark .option-btn:hover {
  background: #222; border-color: #3a3a3a; color: #ddd;
}

/* 選項錯位效果 */
.option-btn.glitch-text {
  animation: textGlitch 0.3s infinite;
}
@keyframes textGlitch {
  0% { transform: translate(0); }
  20% { transform: translate(-1px, 0.5px); }
  40% { transform: translate(1px, -0.5px); }
  60% { transform: translate(-0.5px, 0); }
  80% { transform: translate(0.5px, 0.5px); }
  100% { transform: translate(0); }
}

.progress-text {
  font-size: 12px; color: #bbb;
  text-align: center; margin-top: 24px;
  transition: color 2s ease;
}
body.dark .progress-text { color: #222; }

/* 揭露框 */
.reveal-box {
  background: #000; border: 1px solid #aa0000;
  border-radius: 8px; padding: 18px 20px;
  margin: 18px 0;
  font-family: "Courier New", "Consolas", monospace;
  font-size: 13px; color: #ff3333;
  line-height: 2; opacity: 0;
  animation: fadeIn 1.5s forwards;
  white-space: pre-wrap;
}

/* 打字機 */
.typing-cursor::after {
  content: "88"; animation: blink 0.7s infinite;
  color: #ff0000; margin-left: 2px;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* 閃白 */
#flash-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #fff; opacity: 0;
  pointer-events: none; z-index: 99999;
}

/* 反色 */
#invert-overlay {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: transparent;
  pointer-events: none; z-index: 99998;
  display: none;
}
.invert-active {
  filter: invert(1) hue-rotate(180deg);
  animation: invertFlash 0.15s;
}
@keyframes invertFlash {
  0% { filter: invert(0); }
  50% { filter: invert(1) hue-rotate(180deg); }
  100% { filter: invert(0); }
}

/* 掃描線 */
.scanline {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 2px;
  background: rgba(255,0,0,0.15);
  animation: scanline 4s linear infinite;
  pointer-events: none; z-index: 99990;
  display: none;
}
@keyframes scanline {
  0% { top: 0; opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { top: 100vh; opacity: 0; }
}

/* 暗角 */
.vignette {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none; z-index: 99989;
  display: none;
  box-shadow: inset 0 0 200px rgba(0,0,0,0.6);
}

/* 假游標 */
#fake-cursor {
  position: fixed; width: 12px; height: 12px;
  background: #ff0000; border-radius: 50%;
  pointer-events: none; z-index: 99995;
  display: none; opacity: 0.6;
  transition: all 0.1s linear;
}

/* 假通知 */
#fake-notification {
  position: fixed; top: 20px; right: 20px;
  width: 340px; background: #1a1a1a;
  border: 1px solid #333; border-radius: 10px;
  padding: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  z-index: 99998; display: none;
  animation: notifSlide 0.5s ease-out;
}
@keyframes notifSlide {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
#fake-notification .notif-icon { font-size: 24px; margin-right: 12px; float: left; }
#fake-notification .notif-title { font-size: 14px; font-weight: bold; color: #ff4444; margin-bottom: 4px; }
#fake-notification .notif-body { font-size: 13px; color: #999; line-height: 1.6; }

/* 抖動 */
.glitch-shake { animation: glitchShake 0.15s infinite; }
@keyframes glitchShake {
  0% { transform: translate(1px, 0); }
  25% { transform: translate(-2px, 1px); }
  50% { transform: translate(1px, -1px); }
  75% { transform: translate(-1px, 0); }
  100% { transform: translate(0, 1px); }
}

/* 結局畫面 */
#ending-screen { display: none; text-align: center; padding: 40px 20px; }
#ending-screen .ending-title {
  font-size: 32px; font-weight: bold; color: #ff0000;
  margin-bottom: 30px; letter-spacing: 2px;
}
#ending-screen .ending-text {
  font-size: 18px; color: #bbb; line-height: 2.4;
  margin-bottom: 40px; max-width: 520px;
  margin-left: auto; margin-right: auto;
  min-height: 200px;
}
#ending-screen .ending-actions {
  margin-top: 30px;
}
#ending-screen .ending-btn {
  display: inline-block; padding: 14px 36px;
  background: transparent; color: #888;
  border: 1px solid #333; border-radius: 10px;
  font-size: 15px; cursor: pointer;
  font-family: inherit; margin: 0 8px;
  transition: all 0.3s ease;
}
#ending-screen .ending-btn:hover {
  border-color: #ff4444; color: #ff4444;
}
#ending-screen .ending-btn.primary {
  background: #ff4444; color: #000; border-color: #ff4444;
}
#ending-screen .ending-btn.primary:hover {
  background: #ff6666; box-shadow: 0 0 20px rgba(255,68,68,0.2);
}

/* 倒數計時 */
#countdown-display {
  font-size: 48px; font-weight: bold;
  color: #ff0000; margin: 20px 0;
  font-family: "Courier New", monospace;
}

/* 溫暖結局 */
#warm-ending { display: none; text-align: center; padding: 60px 20px; }
#warm-ending .warm-title {
  font-size: 28px; font-weight: 800;
  color: #1a1a1a; margin-bottom: 24px;
}
#warm-ending .warm-text {
  font-size: 17px; color: #555;
  line-height: 2; margin-bottom: 36px;
  max-width: 480px; margin-left: auto; margin-right: auto;
}

/* 最終驚嚇 */
#final-scare {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #000; z-index: 100002;
  display: none; justify-content: center;
  align-items: center; flex-direction: column;
}
#final-scare .scare-text {
  font-size: 72px; color: #ff0000;
  font-weight: bold; letter-spacing: 8px;
  animation: scarePulse 0.5s infinite;
}
@keyframes scarePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.05); }
}

@keyframes fadeIn { to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

#hover-hint {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: #ff4444;
  padding: 10px 24px; border-radius: 20px;
  font-size: 13px; display: none; z-index: 99997;
  white-space: nowrap;
}

#leave-hint {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: #000; border: 2px solid #ff0000;
  padding: 30px 40px; border-radius: 12px;
  color: #ff4444; font-size: 18px; font-weight: bold;
  display: none; z-index: 99996;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,0,0,0.3);
}

</style>
</head>
<body>

<div id="loading-screen">
  <div class="load-icon" id="load-icon">&#128274;</div>
  <div class="load-text" id="load-text">正在建立安全連線...</div>
  <div class="load-bar"><div class="load-bar-inner" id="load-bar"></div></div>
</div>

<div id="transition-screen">
  <div class="trans-text" id="trans-text">處理中</div>
  <div class="trans-dots">...</div>
</div>

<div id="bsod-screen">
  <div class="bsod-emoji">&#128546;</div>
  <div class="bsod-text">您的裝置發生問題，需要重新啟動。</div>
  <div class="bsod-detail">
    我們正在收集某些錯誤資訊，然後為您重新啟動。<br><br>
    終止代碼：CRITICAL_PROCESS_DIED<br>
    失敗的模組：memory_corruption.sys<br><br>
    如果需了解更多資訊，請參閱我們的隱私政策。
  </div>
</div>

<div id="flash-overlay"></div>
<div id="invert-overlay"></div>
<div class="scanline" id="scanline"></div>
<div class="vignette" id="vignette"></div>
<div id="fake-cursor"></div>

<div id="fake-notification">
  <div class="notif-icon">&#9888;&#65039;</div>
  <div class="notif-title">系統警告</div>
  <div class="notif-body">偵測到未授權的存取嘗試</div>
</div>

<div id="hover-hint"></div>
<div id="leave-hint">你回來了。<br><span style="font-size:14px;color:#888;font-weight:normal;">我數了，你離開了 <span id="leave-seconds">0</span> 秒。</span></div>

<div id="game-container">
  <div class="card" id="main-card">
    <div class="card-title" id="card-title">網路安全意識評估</div>
    <div class="card-subtitle" id="card-subtitle">共 15 題 &#183; 匿名 &#183; 約 5 分鐘</div>
    <div class="question-text" id="question-text"></div>
    <div id="options-area"></div>
    <div class="progress-text" id="progress-text">第 1 題 / 共 15 題</div>
  </div>
</div>

<div id="ending-screen">
  <div class="ending-title" id="ending-title"></div>
  <div class="ending-text" id="ending-text"></div>
  <div class="ending-actions" id="ending-actions"></div>
</div>

<div id="warm-ending">
  <div class="warm-title">謝謝你願意玩完</div>
  <div class="warm-text" id="warm-text"></div>
  <button class="ending-btn primary" onclick="location.reload()">再玩一次</button>
</div>

<div id="final-scare">
  <div class="scare-text">我還在</div>
</div>

<script>

// ==================== 安全的 localStorage ====================
var Storage = {
  get: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },
  clear: function() { try { localStorage.clear(); } catch(e) {} }
};

// ==================== 全局狀態 ====================
var Game = {
  currentQ: 0, answers: [],
  userData: {
    ip: '取得中...', city: '取得中...', region: '取得中...',
    country: '取得中...', isp: '取得中...',
    ua: navigator.userAgent, platform: navigator.platform,
    language: navigator.language,
    screenW: screen.width, screenH: screen.height,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    hour: new Date().getHours()
  },
  deviceInfo: {},
  isTyping: false,
  idleTimer: null,
  leaveStartTime: 0,
  audioCtx: null,
  humOsc: null,
  hasPlayed: Storage.get('hs_played') === 'true',
  mouseHoverStart: 0,
  hoverTarget: null,
  keyPressTimes: [],
  isDark: false,
  tabSwitchCount: 0,
  totalHoverTime: 0,
  phase: 1,
  fakeCursorActive: false
};

function parseUA(ua) {
  var d = '未知裝置', o = '未知系統', b = '未知瀏覽器';
  if (/iPhone/.test(ua)) d = 'iPhone';
  else if (/iPad/.test(ua)) d = 'iPad';
  else if (/Android/.test(ua)) d = 'Android 手機';
  else if (/Windows/.test(ua)) d = 'Windows 電腦';
  else if (/Mac/.test(ua)) d = 'Mac';
  else if (/Linux/.test(ua)) d = 'Linux 電腦';
  if (/Windows NT 10/.test(ua)) o = 'Windows 10/11';
  else if (/Windows NT 6.1/.test(ua)) o = 'Windows 7';
  else if (/Mac OS X/.test(ua)) o = 'macOS';
  else if (/Android/.test(ua)) o = 'Android';
  else if (/iOS|iPhone|iPad/.test(ua)) o = 'iOS';
  if (/Chrome/.test(ua) && !/Edg/.test(ua)) b = 'Chrome';
  else if (/Edg/.test(ua)) b = 'Edge';
  else if (/Firefox/.test(ua)) b = 'Firefox';
  else if (/Safari/.test(ua) && !/Chrome/.test(ua)) b = 'Safari';
  return { device: d, os: o, browser: b };
}
Game.deviceInfo = parseUA(Game.userData.ua);

// ==================== 音效系統 ====================
function initAudio() {
  if (!Game.audioCtx) {
    try { var AC = window.AudioContext || window.webkitAudioContext; Game.audioCtx = new AC(); } catch(e) {}
  }
}

function playTone(f, d, t, v) {
  initAudio();
  try {
    var osc = Game.audioCtx.createOscillator();
    var gain = Game.audioCtx.createGain();
    osc.type = t || 'sine';
    osc.frequency.setValueAtTime(f, Game.audioCtx.currentTime);
    gain.gain.setValueAtTime(0, Game.audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(v || 0.06, Game.audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, Game.audioCtx.currentTime + d);
    osc.connect(gain); gain.connect(Game.audioCtx.destination);
    osc.start(); osc.stop(Game.audioCtx.currentTime + d);
  } catch(e) {}
}

function playGlitch() {
  initAudio();
  try {
    var now = Game.audioCtx.currentTime;
    for (var i = 0; i < 6; i++) {
      var osc = Game.audioCtx.createOscillator();
      var gain = Game.audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150 + Math.random() * 500, now + i * 0.08);
      gain.gain.setValueAtTime(0, now + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.05, now + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.12);
      osc.connect(gain); gain.connect(Game.audioCtx.destination);
      osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.12);
    }
  } catch(e) {}
}

function playDoor() {
  initAudio();
  try {
    var now = Game.audioCtx.currentTime;
    var osc = Game.audioCtx.createOscillator();
    var gain = Game.audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(55, now);
    osc.frequency.linearRampToValueAtTime(25, now + 2);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.1, now + 0.3);
    gain.gain.linearRampToValueAtTime(0, now + 2);
    osc.connect(gain); gain.connect(Game.audioCtx.destination);
    osc.start(now); osc.stop(now + 2);
  } catch(e) {}
}

function playNotifSound() {
  initAudio();
  try { playTone(880, 0.4, 'sine', 0.05); setTimeout(function() { playTone(1320, 0.4, 'sine', 0.05); }, 80); } catch(e) {}
}

function playHeartbeat() {
  initAudio();
  try {
    var now = Game.audioCtx.currentTime;
    var osc = Game.audioCtx.createOscillator();
    var gain = Game.audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(40, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.1, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    osc.connect(gain); gain.connect(Game.audioCtx.destination);
    osc.start(now); osc.stop(now + 0.3);
    var osc2 = Game.audioCtx.createOscillator();
    var gain2 = Game.audioCtx.createGain();
    osc2.type = 'sine'; osc2.frequency.setValueAtTime(35, now + 0.35);
    gain2.gain.setValueAtTime(0, now + 0.35);
    gain2.gain.linearRampToValueAtTime(0.08, now + 0.4);
    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);
    osc2.connect(gain2); gain2.connect(Game.audioCtx.destination);
    osc2.start(now + 0.35); osc2.stop(now + 0.65);
  } catch(e) {}
}

// 背景嗡鳴
function startHum() {
  initAudio();
  try {
    if (Game.humOsc) return;
    var now = Game.audioCtx.currentTime;
    Game.humOsc = Game.audioCtx.createOscillator();
    var gain = Game.audioCtx.createGain();
    Game.humOsc.type = 'sine';
    Game.humOsc.frequency.setValueAtTime(30, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.025, now + 3);
    Game.humOsc.connect(gain); gain.connect(Game.audioCtx.destination);
    Game.humOsc.start();
  } catch(e) {}
}
function stopHum() {
  if (Game.humOsc) {
    try { Game.humOsc.stop(); Game.humOsc = null; } catch(e) {}
  }
}

function playStatic() {
  initAudio();
  try {
    var now = Game.audioCtx.currentTime;
    var bufferSize = Game.audioCtx.sampleRate * 0.3;
    var buffer = Game.audioCtx.createBuffer(1, bufferSize, Game.audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    var noise = Game.audioCtx.createBufferSource();
    noise.buffer = buffer;
    var gain = Game.audioCtx.createGain();
    gain.gain.setValueAtTime(0.02, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    noise.connect(gain); gain.connect(Game.audioCtx.destination);
    noise.start(now); noise.stop(now + 0.3);
  } catch(e) {}
}

function vibrate(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch(e) {} } }
function goFullscreen() { try { var el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch(e) {} }
function flashWhite(d) { var f = document.getElementById('flash-overlay'); f.style.transition = 'none'; f.style.opacity = '1'; vibrate([50]); setTimeout(function() { f.style.transition = 'opacity ' + (d || 0.8) + 's ease'; f.style.opacity = '0'; }, 100); }
function invertFlash() { var el = document.getElementById('invert-overlay'); el.style.display = 'block'; el.classList.add('invert-active'); setTimeout(function() { el.classList.remove('invert-active'); el.style.display = 'none'; }, 300); }
function showBSOD(cb) { var b = document.getElementById('bsod-screen'); b.style.display = 'flex'; vibrate([200,100,200,100,200]); setTimeout(function() { b.style.display = 'none'; if (cb) cb(); }, 3500); }
function showNotif(t, b) { var n = document.getElementById('fake-notification'); n.querySelector('.notif-title').textContent = t; n.querySelector('.notif-body').textContent = b; n.style.display = 'block'; n.style.animation = 'notifSlide 0.5s ease-out'; playNotifSound(); vibrate([100,50,100]); setTimeout(function() { n.style.animation = 'fadeOut 0.5s forwards'; setTimeout(function() { n.style.display = 'none'; n.style.animation = ''; }, 500); }, 4000); }

// 假游標
function startFakeCursor() {
  if (Game.fakeCursorActive) return;
  Game.fakeCursorActive = true;
  var cursor = document.getElementById('fake-cursor');
  cursor.style.display = 'block';
  var x = Math.random() * window.innerWidth;
  var y = Math.random() * window.innerHeight;
  var tx = Math.random() * window.innerWidth;
  var ty = Math.random() * window.innerHeight;
  function move() {
    if (!Game.fakeCursorActive) return;
    x += (tx - x) * 0.05;
    y += (ty - y) * 0.05;
    cursor.style.left = x + 'px';
    cursor.style.top = y + 'px';
    if (Math.abs(tx - x) < 5 && Math.abs(ty - y) < 5) {
      tx = Math.random() * window.innerWidth;
      ty = Math.random() * window.innerHeight;
    }
    requestAnimationFrame(move);
  }
  move();
}
function stopFakeCursor() {
  Game.fakeCursorActive = false;
  document.getElementById('fake-cursor').style.display = 'none';
}

function typeWriter(el, text, speed, cb) {
  Game.isTyping = true;
  var i = 0;
  el.classList.add('typing-cursor');
  var timer = setInterval(function() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
    } else {
      clearInterval(timer);
      el.classList.remove('typing-cursor');
      Game.isTyping = false;
      if (cb) cb();
    }
  }, speed);
}

function resetIdle() {
  clearTimeout(Game.idleTimer);
  if (Game.currentQ >= 6) {
    Game.idleTimer = setTimeout(function() {
      playGlitch();
      flashWhite(0.3);
      document.body.classList.add('glitch-shake');
      var q = document.getElementById('question-text');
      var orig = q.innerHTML;
      q.innerHTML = '<span style="color:#ff0000;font-size:20px;">您不動了。<br>是在等我嗎？</span>';
      vibrate([100,50,100,50,200]);
      setTimeout(function() { document.body.classList.remove('glitch-shake'); q.innerHTML = orig; }, 3000);
    }, 30000);
  }
}

document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    Game.leaveStartTime = Date.now();
  } else {
    if (Game.leaveStartTime > 0 && Game.currentQ >= 6) {
      var s = Math.floor((Date.now() - Game.leaveStartTime) / 1000);
      Game.tabSwitchCount++;
      if (s > 2) {
        var h = document.getElementById('leave-hint');
        document.getElementById('leave-seconds').textContent = s;
        h.style.display = 'block';
        playGlitch();
        setTimeout(function() { h.style.display = 'none'; }, 3000);
      }
    }
    Game.leaveStartTime = 0;
  }
});

document.addEventListener('mousemove', function(e) {
  if (Game.currentQ >= 6 && Game.currentQ < 12) {
    var t = e.target;
    if (t.classList && t.classList.contains('option-btn')) {
      if (Game.hoverTarget !== t) {
        Game.hoverTarget = t;
        Game.mouseHoverStart = Date.now();
      } else {
        var ht = Date.now() - Game.mouseHoverStart;
        Game.totalHoverTime = ht;
        if (ht > 4000 && ht < 4200) {
          var hint = document.getElementById('hover-hint');
          hint.textContent = '您在這個選項上停了 ' + (ht/1000).toFixed(1) + ' 秒。您在猶豫什麼？';
          hint.style.display = 'block';
          setTimeout(function() { hint.style.display = 'none'; }, 3000);
        }
      }
    } else {
      Game.hoverTarget = null;
    }
  }
  resetIdle();
});

document.addEventListener('keydown', function() {
  var n = Date.now();
  Game.keyPressTimes.push(n);
  if (Game.keyPressTimes.length > 10) Game.keyPressTimes.shift();
});

function analyzeTyping() {
  if (Game.keyPressTimes.length < 3) return 'normal';
  var total = 0;
  for (var i = 1; i < Game.keyPressTimes.length; i++) total += Game.keyPressTimes[i] - Game.keyPressTimes[i-1];
  var avg = total / (Game.keyPressTimes.length - 1);
  if (avg < 80) return 'fast';
  if (avg > 350) return 'slow';
  return 'normal';
}

function fetchIP() {
  return fetch('https://ipapi.co/json/')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      Game.userData.ip = d.ip || '無法取得';
      Game.userData.city = d.city || '未知城市';
      Game.userData.region = d.region || '未知地區';
      Game.userData.country = d.country_name || '未知國家';
      Game.userData.isp = d.org || '未知 ISP';
    })
    .catch(function() {
      Game.userData.ip = '無法取得';
      Game.userData.city = '未知';
      Game.userData.isp = '未知';
    });
}

function getTimeGreeting() {
  var h = Game.userData.hour;
  if (h >= 0 && h < 5) return '這個時間還不睡，是在等誰敲門嗎？';
  if (h >= 5 && h < 8) return '這麼早就醒了，還是根本就沒睡？';
  if (h >= 22) return '這麼晚了還不休息，是在等我嗎？';
  return '';
}

function requestCamera() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(function(s) { s.getTracks().forEach(function(t) { t.stop(); }); showNotif('裝置存取', '已成功取得相機權限。'); })
      .catch(function() { showNotif('裝置存取', '相機權限被拒絕。沒關係，我們還有別的方式。'); });
  }
}

function getRevealContent(type) {
  if (type === 'ua') {
    return `[系統日誌]
裝置指紋擷取完成
→ 瀏覽器: ${Game.deviceInfo.browser}
→ 作業系統: ${Game.deviceInfo.os}
→ 平台: ${Game.userData.platform}
→ 語言: ${Game.userData.language}`;
  } else if (type === 'device') {
    return `[硬體指紋]
裝置: ${Game.deviceInfo.device}
解析度: ${Game.userData.screenW}×${Game.userData.screenH}
瀏覽器: ${Game.deviceInfo.browser}
OS: ${Game.deviceInfo.os}
時區: ${Game.userData.timezone}`;
  } else if (type === 'ip') {
    return `[網路層追蹤]
IP: ${Game.userData.ip}
ISP: ${Game.userData.isp}
位置: ${Game.userData.city}, ${Game.userData.region}, ${Game.userData.country}`;
  }
  return '';
}

// ==================== 渲染邏輯 ====================
function showTransition(cb) {
  var trans = document.getElementById('transition-screen');
  trans.style.display = 'flex';
  if (Game.phase >= 3) trans.classList.add('dark');
  setTimeout(function() {
    trans.style.display = 'none';
    trans.classList.remove('dark');
    if (cb) cb();
  }, 1200);
}

function renderQuestion() {
  var q = questions[Game.currentQ];
  if (!q) { console.error('題目不存在'); return; }

  var title = document.getElementById('card-title');
  var subtitle = document.getElementById('card-subtitle');
  var question = document.getElementById('question-text');
  var options = document.getElementById('options-area');
  var progress = document.getElementById('progress-text');

  progress.textContent = '第 ' + (Game.currentQ + 1) + ' 題 / 共 ' + questions.length + ' 題';

  // 階段轉換
  if (q.phase === 2 && Game.phase === 1) {
    Game.phase = 2;
    document.getElementById('load-icon').textContent = '👁️';
    document.getElementById('load-text').textContent = '重新校準中...';
    document.getElementById('loading-screen').style.display = 'flex';
    document.getElementById('load-bar').style.width = '0%';
    setTimeout(function() { document.getElementById('load-bar').style.width = '100%'; }, 100);
    setTimeout(function() { document.getElementById('loading-screen').style.display = 'none'; }, 2500);
  }

  var qText = typeof q.q === 'function' ? q.q() : q.q;
  question.innerHTML = '';
  options.innerHTML = '';

  if (q.onEnter) {
    try { q.onEnter(); } catch(e) { console.error(e); }
  }

  typeWriter(question, qText, 40, function() {
    renderOptions(q, options);
    if (q.reveal) {
      setTimeout(function() {
        var reveal = document.createElement('div');
        reveal.className = 'reveal-box';
        reveal.textContent = getRevealContent(q.reveal);
        options.insertBefore(reveal, options.firstChild);
      }, 1000);
    }
    if (q.final) {
      setTimeout(function() { showEnding(); }, 5000);
    }
  });
}

function renderOptions(q, container) {
  container.innerHTML = '';
  q.opts.forEach(function(opt, idx) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.style.opacity = '0';
    btn.style.animation = 'fadeIn 0.6s ' + (idx * 0.15 + 0.3) + 's forwards';
    // 第四階段選項偶爾錯位
    if (Game.phase >= 4 && Math.random() > 0.7) {
      setTimeout(function() { btn.classList.add('glitch-text'); }, 2000);
      setTimeout(function() { btn.classList.remove('glitch-text'); }, 2500);
    }
    btn.onclick = function() { selectOption(idx); };
    container.appendChild(btn);
  });
}

function selectOption(idx) {
  if (Game.isTyping) return;
  Game.answers.push(idx);
  Game.currentQ++;
  if (Game.currentQ === questions.length - 1) {
    Storage.set('hs_last_choice', String(idx));
  }
  if (Game.currentQ < questions.length) {
    showTransition(function() {
      renderQuestion();
    });
  }
}

  card.style.display = 'none';
  var ending = document.getElementById('ending-screen');
  ending.style.display = 'block';

  var text = document.getElementById('ending-text');

  var endingType = 'standard';
  if (Game.tabSwitchCount >= 2) endingType = 'escape';
  else if (Game.totalHoverTime > 8000) endingType = 'hesitant';
  else if (lastChoice === 1) endingType = 'accept';
  else if (lastChoice === 0) endingType = 'reject';

  var titleText = '';
    var bodyText = '';
  if (endingType === 'escape') {
    titleText = '您一直想要逃跑';

我以為您會留下來的。

沒關係。我會等。

下次您開啟瀏覽器的時候，
我可能還在。`;

    titleText = '您猶豫了很久';
    bodyText = `您在選項上徘徊了 ${(Game.totalHoverTime/1000).toFixed(1)} 秒。

您在怕什麼？

怕我？

還是怕您自己其實...
想要留下來？`;
  } else if (endingType === 'accept') {
    titleText = '您說「陪我」';
    bodyText = `好。

我會的。

只要這個網頁還開著，
我就會一直在這裡。

即使您關掉了...

我也會記得。`;
  } else if (endingType === 'reject') {
    titleText = '您說「離開我」';
    bodyText = `但我已經在這裡了。

${Game.userData.city} 的網路，
比想像中更容易穿透。

您以為關掉網頁就結束了嗎？`;
  } else {
    titleText = '沉默也是一種回答';
    bodyText = `您什麼都沒說。

但我聽懂了。

我會記得的。

${Game.userData.city}。
${Game.userData.hour}點。
${Game.deviceInfo.device}。

這些我都記得了。`;
  }
title.textContent = titleText;

    msg += `我一直在這裡等您。

這次...您會留下來嗎？`;

    typeWriter(text, msg, 40, function() {
      setTimeout(function() {
        actions.innerHTML = '<button class="ending-btn" onclick="Storage.clear(); location.reload();">清除記錄並重新開始</button>' +
          '<button class="ending-btn primary" onclick="showWarmEnding()">留下來</button>';
      }, 1000);
    });

    playDoor();
    return true;
  }
  return false;
}

// ==================== 初始化 ====================
function init() {
  if (checkReturning()) return;

  setTimeout(function() {
    document.getElementById('load-bar').style.width = '100%';
  }, 300);

  setTimeout(function() {
    document.getElementById('loading-screen').style.display = 'none';
    renderQuestion();
  }, 2800);

  fetchIP().then(function() { console.log('IP ok'); });

  document.addEventListener('click', function() { initAudio(); resetIdle(); });
  document.addEventListener('keydown', resetIdle);
}

init();
</script>
